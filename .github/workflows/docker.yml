# Build the image and publish it to the GitHub Container Registry.
#
# Portainer redeploys a stack with 'docker-compose up -d', and there is no
# '--build' in it: a stack redeploy updates the compose file but keeps the
# image it already has.  So the image has to be published somewhere, and
# this is that somewhere.  A push to main builds it and pushes it;
# Portainer polls the repository, re-pulls the image and restarts the
# container with the new one.
#
# The registry login uses the workflow's own GITHUB_TOKEN, which needs the
# 'packages: write' permission below - there is no secret to set up.

name: publish the image

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow's own token can write to the registry, and can make the one
# small commit at the end that tells Portainer the image is ready.
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - name: the code
        uses: actions/checkout@v4

      # The Raspberry Pi 3 is 32-bit, and it is built here rather than on
      # the runner, so the emulation is set up first.
      - name: emulation for other architectures
        uses: docker/setup-qemu-action@v3

      - name: the builder
        uses: docker/setup-buildx-action@v3

      - name: sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: name the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # A hosted Intel server, an Apple Silicon Mac or a Raspberry Pi 4
          # or 5, and a Raspberry Pi 3.  One image for all of them.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Now the image is in the registry, and Portainer can be told.
      #
      # Portainer notices that the repository has changed and redeploys the
      # stack, re-pulling the image as it does.  It would rather do that
      # *after* the image is published, because a redeploy that finds the
      # old image leaves the old code running until the next commit.
      #
      # So this empty commit says "the image for this commit is ready", and
      # it is made after the push rather than before it.  '[skip ci]' keeps
      # it from starting the whole workflow all over again.
      - name: tell Portainer the image is ready
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "publish ${GITHUB_SHA:0:7} [skip ci]"
          git push

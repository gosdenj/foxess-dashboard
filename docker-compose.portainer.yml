# The FoxESS dashboard, as a Portainer stack.
#
#   Stacks -> Add stack -> Git repository
#     Repository URL      https://github.com/gosdenj/foxess-dashboard.git
#     Repository reference refs/heads/main
#     Compose path        docker-compose.portainer.yml
#
# The image comes from the GitHub Container Registry rather than from the
# repository, because Portainer redeploys a stack with 'docker-compose up
# -d' - there is no '--build' in it.  A stack redeploy therefore updates
# the compose file but keeps the image it already has, so the image has to
# be published somewhere for a new commit to reach the running container.
#
# The GitHub workflow (.github/workflows/docker.yml) builds and publishes
# the image on every push, and Portainer is told to re-pull the image
# every time it updates the stack.  Push, wait a few minutes, and the new
# version is running.

services:
  foxess-dashboard:
    image: ghcr.io/gosdenj/foxess-dashboard:latest
    container_name: foxess-dashboard
    restart: unless-stopped

    # The port on the host that the Pi screens will use.  Change it in the
    # stack's environment variables.
    ports:
      - "${FOXESS_PORT:-8765}:8765"

    volumes:
      # The settings file and its history.
      #
      # A named volume rather than a folder on the host: it is the same
      # everywhere, it survives a redeploy, and it does not depend on the
      # host and the container sharing a filesystem - which they do not, if
      # Portainer is running in a container with Docker Desktop underneath.
      #
      # The volume takes its ownership from the image, so the container can
      # write to it without anybody having to chown anything.
      - foxess-config:/config

    environment:
      # Where the settings file is, inside the container.
      FOXESS_DASHBOARD_CONFIG: /config/config.json
      # Listen on every interface inside the container, so the port mapping
      # above can reach it.
      FOXESS_HOST: 0.0.0.0
      # The port inside the container.  The host side is the mapping above.
      FOXESS_PORT: "8765"
      # The container's timezone.  The dashboard's own timezone is the
      # display.timezone setting; this is what the OS is told.
      TZ: "${TZ:-Europe/London}"

    # The container runs as uid 1000, which owns the volume, so it can
    # write the settings and nothing else.
    user: "${FOXESS_UID:-1000}:${FOXESS_GID:-1000}"

    # The dashboard is chatty for a few seconds at start, then quiet.  Cap
    # the log so it cannot quietly fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  foxess-config:
    # The name is fixed, so the volume is the same one whatever the stack
    # is called, and it is easy to find.
    name: foxess-config

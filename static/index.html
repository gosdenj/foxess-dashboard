<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<title>FoxESS</title>
<style>
:root{
  --bg:#0a0e16; --panel:#111827; --panel2:#0f1622; --line:rgba(255,255,255,.08);
  --text:#e5e9f0; --muted:#8b97ab; --dim:#5d6a80;
  --pv:#f5b642; --load:#4a9eff; --grid:#a78bfa; --bat:#34d399; --alarm:#f87171;
  --flux:#f0a868;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
            "Liberation Sans","DejaVu Sans","Noto Sans",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
              "Liberation Mono","DejaVu Sans Mono","Noto Sans Mono",monospace;
  --gap:clamp(5px,.95vmin,13px);
  --pad:clamp(7px,1.25vmin,16px);
  --fs:clamp(13px,calc(0.7vmin + 6px),16px);
  --fsl:clamp(11px,calc(0.55vmin + 6px),13px);
  --fsb:clamp(17px,calc(1.5vmin + 6px),28px);
  --r:clamp(7px,1vmin,14px);
}
html[data-theme="light"]{
  --bg:#f2f4f8; --panel:#ffffff; --panel2:#f7f9fc; --line:rgba(15,23,42,.12);
  --text:#16202f; --muted:#5a6a80; --dim:#8a97a8;
  --pv:#d98a00; --load:#1668d6; --grid:#7048d8; --bat:#0e9f6e; --alarm:#dc2626;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);
     font-family:var(--font-ui);
     font-size:var(--fs);
     font-weight:400;
     line-height:1.4;
     -webkit-font-smoothing:antialiased;
     -moz-osx-font-smoothing:grayscale;
}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---- shell: one screen, never scrolls ---- */
.app{height:100dvh;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
header{display:flex;align-items:center;gap:var(--gap);flex-wrap:nowrap;overflow:hidden;
       padding:var(--pad) var(--pad) 0}
h1{font-size:var(--fs);margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap;
   overflow:hidden;text-overflow:ellipsis}
h1 .sub{color:var(--dim);font-weight:400;font-size:var(--fsl);margin-left:.5em}
.spacer{flex:1 1 auto;min-width:0}
.pill{display:inline-flex;align-items:center;gap:.5em;padding:.3em .7em;border-radius:999px;
      background:var(--panel2);border:1px solid var(--line);font-size:var(--fsl);color:var(--muted);
      white-space:nowrap}
.dot{width:.6em;height:.6em;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--bat);box-shadow:0 0 0 .25em rgba(52,211,153,.16)}
.dot.off{background:var(--alarm);box-shadow:0 0 0 .25em rgba(248,113,113,.16)}
/* The cog is small on purpose - there is not much room for it - but it
   has to be easy to hit on a touch screen, so the picture is a little
   bigger and the target is bigger still than the picture. */
.gear{background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--muted);
      padding:.2em .5em;font-size:calc(var(--fsl) * 1.25);line-height:1;
      text-decoration:none;white-space:nowrap;position:relative}
.gear::after{content:"";position:absolute;inset:-.55em -.4em;border-radius:999px}
.gear:hover{color:var(--text);border-color:var(--muted)}

/* The clock carries the date as well as the time.  The top of the
   screen is the one part of the dashboard that does not change with
   the slide, so it is the right place to say what day it is. */
#clockPill{gap:0}
#clockDate::after{content:" · ";opacity:.55}
#clockWd::after,#clockDm::after{content:" "}
/* A small screen has not got room for the plant details, and the name
   is what matters. */
@media(max-width:640px),(max-height:400px){
  h1 .sub{display:none}
}

/* ---- main grid ---- */
.dash{display:grid;gap:var(--gap);padding:var(--gap);min-height:0;overflow:hidden;
      grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
      grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);
      grid-template-areas:"flow side" "totals sys"}
/* The stage holds the slide that is showing, and for a moment the one
   that is leaving as well - so that the new slide can come in over the
   top of it, the way a card is dealt onto a deck.  The leaving slide is
   a copy, so it has to be behind: it is the copy that fades away under
   the slide arriving. */
.stage{position:relative;min-height:0;overflow:hidden;display:grid;
       grid-template-rows:minmax(0,1fr)}
.stage > .dash{position:relative;z-index:1;background:var(--bg)}
.stage > .dash.ghost{position:absolute;inset:0;z-index:0;pointer-events:none}
/* While a slide is being dealt in it throws a shadow onto the slide
   underneath it, which is what makes it read as a card rather than as
   a picture sliding past. */
.stage > .dash.dealing{box-shadow:-24px 0 48px -16px rgba(0,0,0,.65)}
.flow{grid-area:flow}.side{grid-area:side}
.totals{grid-area:totals}.system{grid-area:sys}
.usage{grid-area:usage}.octopus{grid-area:octopus}.today{grid-area:today}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
       padding:var(--pad);margin:0;min-height:0;min-width:0;overflow:hidden;
       display:flex;flex-direction:column}
.panel h2{font-size:var(--fsl);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
          margin:0 0 .5em;font-weight:600;flex:none}
.panel h2 .src{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim);
          opacity:.75;margin-left:.4em;font-size:.92em}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1 1 auto;scrollbar-width:thin;
        -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
        mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent)}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* ---- power flow ---- */
.flowwrap{position:relative;flex:1 1 0;min-height:0}
.flowsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.flowsvg .lbl{font-family:var(--font-mono);font-size:clamp(12px,1.5vmin,15px);
               font-weight:600;fill:var(--muted);letter-spacing:.04em}
.flowsvg .val{font-family:var(--font-mono);font-size:clamp(21px,2.6vmin,28px);
               font-weight:700;fill:var(--text)}
.flowsvg .unit{font-family:var(--font-mono);font-size:clamp(10px,1.2vmin,13px);
               font-weight:500;fill:var(--muted);
            paint-order:stroke fill;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.flowsvg .fstat{font-family:var(--font-ui);font-size:13px;fill:var(--dim)}
.flowsvg .fname{font-family:var(--font-mono);font-size:13px;fill:var(--muted);
                 letter-spacing:.06em}
.flowsvg .node,.flowsvg .fnode{fill:var(--panel2);stroke-width:3}
.flowsvg .wire{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.85}
.flowsvg .moving{stroke-dasharray:7 11;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@media(prefers-reduced-motion:reduce){.flowsvg .moving{animation:none}}
.flowhint{font-size:var(--fsl);color:var(--dim);flex:none;margin-top:.4em;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:var(--gap);
       flex:none}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
      padding:.5em .65em;min-width:0}
.tile .k{font-size:var(--fsl);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
         display:flex;align-items:center;gap:.5em;white-space:nowrap;overflow:hidden}
.tile .swatch{width:.6em;height:.6em;border-radius:2px;flex:none}
.tile .v{font-family:var(--font-mono);font-size:var(--fsb);font-weight:700;line-height:1.1;
         margin-top:.15em;font-variant-numeric:tabular-nums;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.45em;color:var(--dim);font-weight:500;margin-left:.2em}
.tile .note{color:var(--dim);font-size:var(--fsl);margin-top:.1em;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- gauge ---- */
.gauge{flex:none;display:flex;align-items:center;gap:var(--gap);justify-content:center}
.gauge svg{height:clamp(70px,13vmin,150px);width:auto;flex:none}
.gauge .big{font-family:var(--font-mono);font-size:clamp(16px,3.4vmin,36px);
            font-weight:700;fill:var(--text)}
.gauge .cap{color:var(--dim);font-size:var(--fsl);text-align:center}
.gauge .stack{display:flex;flex-direction:column;gap:.2em;min-width:0}

/* slim SoC bar - used instead of the arc when vertical space is tight */
.socbar{display:none;position:relative;height:13px;border-radius:7px;flex:none;
        background:rgba(128,128,128,.18);margin-top:.45em;overflow:visible}
.socbar .fill{height:100%;border-radius:7px;background:var(--bat);width:0}
.socbar .floor{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;
               background:var(--alarm)}
.socbar .cap{position:absolute;left:0;right:0;top:16px;font-size:var(--fsl);color:var(--dim);
             text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:var(--fsl)}
td{padding:.32em 0;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.k{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
td.v{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;padding-left:.6em}
.hint{color:var(--dim);font-size:var(--fsl);margin-top:.4em;flex:none;line-height:1.4}


.ringsvg .rhub{font-family:var(--font-ui);font-size:13px;fill:var(--muted);
                letter-spacing:.06em}

/* ---- responsive ---- */
.tiny-only{display:none}

/* ---- panel visibility toggles ---- */
body.no-totals .totals{display:none}
body.no-system .system{display:none}
body.no-soc .gauge,body.no-soc .socbar{display:none}
body[data-layout="full"] .dash{grid-template-areas:"flow side" "totals sys"}
body.no-totals[data-layout="full"] .dash{grid-template-areas:"flow side" "sys sys"}
body.no-system[data-layout="full"] .dash{grid-template-areas:"flow side" "totals totals"}
body.no-totals.no-system[data-layout="full"] .dash{grid-template-areas:"flow side" "flow side"}
@media(max-width:1000px),(max-height:560px){
  .dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);
        grid-template-areas:"flow flow" "side totals"}
  .system{display:none}
  .gauge{display:none}
  .socbar{display:block}
  .totals .hint{display:none}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr));gap:calc(var(--gap) * .7)}
  .tile{padding:.4em .5em}

}
@media(max-width:640px),(max-height:400px){
  body .dash[data-slide="usage"]{grid-template-areas:"usage usage" "today today"}
  .dash{grid-template-columns:minmax(0,1fr);
        grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);
        grid-template-areas:"flow" "side"}
  .totals{display:none}
  h1 .sub{display:none}
}
/* Tiny screens (3.5" and 2.8" LCDs): the diagram cannot be read at this
   size, so drop it and give the whole screen to the numbers. */
@media(max-width:560px),(max-height:360px){
  .dash{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);
        grid-template-areas:"side"}
  .flow{display:none}
  .side{justify-content:center}
  .side h2{display:none}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile .note{display:none}

  .socbar{height:auto;margin-top:.5em;padding-bottom:.15em}
  .socbar .fill{height:11px}
  .socbar .floor{top:0;bottom:auto;height:11px}
  .socbar .cap{position:static;display:block;margin-top:.3em;text-align:center}
  .flowhint.tiny-only{white-space:normal;font-size:var(--fsl);
                      text-align:center;margin-top:.45em}
  .tiny-only{display:block}
}
/* Five tiles across need ~440px of viewport; below that, 3+2 wraps instead */
@media(min-width:440px){
  body:where([data-layout="tiny"]) .tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(max-width:400px){
  .pill.hide-sm{display:none}
}

/* ---- explicit layout overrides from the settings page ---- */
body[data-layout="full"] .dash{
  grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
  grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);
  grid-template-areas:"flow side" "totals sys"}
body[data-layout="compact"] .dash{
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);
  grid-template-areas:"flow flow" "side totals"}
body[data-layout="compact"] .system{display:none}
body[data-layout="tiny"] .dash{
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);
  grid-template-areas:"flow" "side"}
body[data-layout="tiny"] .totals,body[data-layout="tiny"] .system{display:none}

.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.32);color:#fca5a5;
     border-radius:var(--r);padding:.5em .8em;font-size:var(--fsl);margin:0 var(--gap);
     flex:none}
/* ---- the target: Raspberry Pi 3 + official 7" touch display, 800x480 ----
   A fixed target means the type can be sized for exactly this panel instead
   of being compromised for a range of unknown screens. */
@media(min-width:760px) and (max-width:900px) and (min-height:450px) and (max-height:520px){
  :root{
    --fs:15px;
    --fsl:13px;
    --fsb:24px;
    --gap:7px;
    --pad:9px;
  }
  /* Full-width diagram on top, live tiles and totals sharing the bottom row,
     so the tiles get the width they need for large numbers. */
  body:not([data-layout="tiny"]) .dash{
    grid-template-columns:minmax(0,2fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1.18fr) minmax(0,1fr);
    grid-template-areas:"flow flow" "side totals";
  }
  .flowsvg .lbl{font-size:15px}
  .flowsvg .val{font-size:27px}
  .flowsvg .unit{font-size:13px}
  .flowsvg .fstat{font-size:14px}
  .flowsvg .fname{font-size:14px}
  .tile .note{display:none}
  .tile .v{line-height:1.05}
  .tile{padding:.45em .55em}
  .tiles{gap:calc(var(--gap) * .7)}
  /* the SoC caption is absolutely positioned below the bar, so the bar needs
     bottom margin of its own or it collides with what follows */
  .socbar{height:16px;margin-top:.55em;margin-bottom:1.55em}
  .socbar .fill{height:16px}
  .socbar .floor{top:-4px;bottom:-4px;height:24px}
  .flowhint{font-size:13px}
  td{padding:.4em 0}
  .totals .hint{display:none}

  /* The self-sufficiency line moves down into the LIVE panel, which has room
     for it. That buys ~25px of height for the totals table. */
  #flowHint{display:none}
  .flowhint.tiny-only{display:block;white-space:nowrap;overflow:hidden;
                      text-overflow:ellipsis;margin-top:.5em}

  /* Tighter rows so the table fits without clipping a row in half. */
  .totals td{padding:.05em 0}
  .totals tr.p3{display:none}
}

/* ---- rings diagram: a hub and its satellites, Home Assistant style ----
   Sits at the end of the stylesheet so it wins over the responsive rules,
   but only for the automatic layout - an explicit "full" or "compact"
   choice from the settings page still wins, and the small-screen layouts
   keep their own arrangement. */
.ringsvg{display:none}
body[data-diagram="rings"] .ringsvg{display:block}
body[data-diagram="rings"] .flowsvg:not(.ringsvg){display:none}
body[data-diagram="rings"][data-layout="auto"] .system,
body[data-diagram="flow"][data-layout="auto"] .system{display:none}
/* ...except on the energy slide, which is where it belongs */
body[data-diagram="rings"] #flowHint{display:none}
body[data-diagram="flow"] .side .flowhint.tiny-only{display:none}
/* the hub shows the battery level now, so the summary line moves down into
   the LIVE panel - and the SoC bar caption gives up its place for it,
   because the SoC tile already shows the number. */
body[data-diagram="rings"] .socbar .cap{display:none}
/* the caption is absolutely positioned, so with it gone the bar does not
   need the room it was reserving under itself */
body[data-diagram="rings"] .socbar{margin-bottom:.15em}



.ringsvg .rnode{fill:var(--panel2);stroke-width:3}
.ringsvg .rtrack{fill:none;stroke:var(--line);stroke-width:6}
.ringsvg .rarc{fill:none;stroke-width:6;stroke-linecap:round;
               transition:stroke-dasharray .4s ease, stroke .4s ease}
.ringsvg .rval{font-family:var(--font-mono);font-size:25px;fill:var(--text)}
.ringsvg .rname{font-family:var(--font-mono);font-size:13px;fill:var(--muted);
                letter-spacing:.06em}
.ringsvg .rstatus{font-family:var(--font-ui);font-size:13px;fill:var(--dim)}
.ringsvg .rval.charged{fill:var(--bat)}
.ringsvg .rval.low{fill:var(--pv)}
.ringsvg .rval.crit{fill:var(--alarm)}
.ringsvg .ricon{stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ringsvg .rwire{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.9;
                 stroke-dasharray:5 9}
.ringsvg .rwire.rev{animation-direction:reverse}
.ringsvg .moving{animation:rflow 1.1s linear infinite}
@keyframes rflow{to{stroke-dashoffset:-28}}


/* ---- the slides -------------------------------------------------------
   A slide is a named view. Only the panels that belong to the current one
   are shown, and the grid is laid out for that slide. */
.usage,.octopus,.today{display:none}
body .dash[data-slide="power"] .usage,
body .dash[data-slide="power"] .octopus,
body .dash[data-slide="power"] .today{display:none}
body .dash[data-slide="usage"] .flow,
body .dash[data-slide="usage"] .side,
body .dash[data-slide="usage"] .totals,
body .dash[data-slide="usage"] .system{display:none}
body .dash[data-slide="usage"] .usage,
body .dash[data-slide="usage"] .octopus,
body .dash[data-slide="usage"] .today{display:flex}

/* ---- the slide transition -----------------------------------------------
   The panels come in from the right when the slide changes, and the
   header stays where it is - it carries the clock, and it is the one
   part of the screen that does not change.

   There is no animation rule here on purpose.  The animation is
   started from the script, in applySlide(), because a CSS animation
   runs once and then keeps its final state, and the rule for a slide
   stays matched while that slide is showing - so it would not run
   again on the next change. */

/* The grid for each slide. These have to be per breakpoint - a desktop
   area map applied at 800x480 would override the compact layout.

   The rules are written against the slide rather than against the
   body, so that a copy of a slide - the one that is on its way out -
   keeps showing the slide it was copied from.  The body is still in
   the selector so that the slide rules and the layout setting, which
   is also written against the body, weigh the same; the slide rules
   come later in the file, so the slide owns the grid either way. */
@media(min-width:1001px) and (min-height:561px){
  body .dash[data-slide="power"]{
    grid-template-areas:"flow side" "totals sys"}
  body .dash[data-slide="usage"]{
    grid-template-columns:minmax(0,2fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1.45fr) minmax(0,1fr);
    grid-template-areas:"usage octopus" "today today"}
}

/* the chart */
.chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.chartbox svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:14px;font-size:var(--fsl);color:var(--dim);flex:none;
  margin-top:.45em;align-items:center;white-space:nowrap;overflow:hidden}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
  vertical-align:-1px}
.bandtag{display:inline-block;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
  margin-left:auto;flex:none}
.bandtag.peak{color:var(--flux);border-color:rgba(240,168,104,.45);
  background:rgba(240,168,104,.12)}
.bandtag.cheap{color:#7dd3fc;border-color:rgba(125,211,252,.4);
  background:rgba(125,211,252,.1)}
.octopus .tiles{grid-template-columns:repeat(2,minmax(0,1fr));flex:1 1 auto;min-height:0}
.octopus h2{display:flex;align-items:center;gap:.5em}
.octopus .livepill{margin-left:auto;text-transform:none;letter-spacing:0;
  font-weight:600;color:var(--flux);border:1px solid var(--flux);
  border-radius:999px;padding:.05em .5em;font-size:var(--fss);
  white-space:nowrap;opacity:.95}
.octopus .livepill[hidden]{display:none}
.octopus .tile .note.peak{color:var(--flux)}
.octopus .tile .note.cheap{color:#7dd3fc}
.octopus .tiles .tile{justify-content:center}
.octopus .tiles .tile .v{font-size:clamp(19px,2.1vmin,26px)}
.today .tiles{grid-template-columns:repeat(6,minmax(0,1fr));flex:1 1 auto;min-height:0}
.today .tiles .tile{justify-content:center}
.today .tiles .tile .v{font-size:clamp(17px,2vmin,26px)}
.panel .hint{color:var(--dim);font-size:var(--fsl);margin-top:.5em;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .hint b{color:var(--flux);font-weight:600}
/* The Octopus panel is narrow, so its hint wraps rather than being cut */
body .dash[data-slide="usage"] .octopus .hint{white-space:normal;overflow:visible;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---- the Live panel on a large screen ---------------------------------
   The panel should show what the diagram does not. The rings diagram
   already carries the battery level - in the hub and around the battery
   node - so the panel drops it and gives the space to the power figures.
   The linear flow diagram has no battery level in it at all, so there the
   panel carries it, as a ring in the same language as the diagram.

     flow  ->  B   a battery ring on the left, four stats in a 2x2 grid
     rings ->  E   four large stats across the full width
*/
@media(min-width:1001px) and (min-height:561px){
  .side{display:grid;grid-template-columns:minmax(0,1fr);
        grid-template-rows:auto minmax(0,1fr) auto;row-gap:0}
  .side h2{grid-row:1}
  .side .tiles{grid-row:2}
  .side .flowhint.tiny-only{grid-row:3}

  /* the battery tile is the diagram's job on a big screen */
  .side .tiles .tile.soc{display:none}

  /* Big numbers - the panel has the room, so use it. The size steps with
     the width, because the widest value ("-12.34") needs three times the
     font size and the tiles get narrower as the panel does. */
  .side{--tval:34px}
  .side .tile{display:flex;flex-direction:column;justify-content:center;
               padding:.6em .8em}
  .side .tile .v{font-size:var(--tval);margin-top:.2em}
  .side .tile .note{font-size:14px;margin-top:.25em}

  /* E - rings: four stats across the full width, and no ring - the
     diagram is showing the battery level already */
  body[data-diagram="rings"] .side .gauge{display:none}
  body[data-diagram="rings"] .side .tiles{
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:minmax(0,1fr)}
  body[data-diagram="rings"] .side .tile .note{font-size:15px}
  /* the rings diagram is the only place the level appears, so say so */
  body[data-diagram="rings"] .side .flowhint.tiny-only{
    display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:.7em}

  /* B - flow: the battery ring on the left, four stats in a 2x2 grid */
  body[data-diagram="flow"] .side{
    grid-template-columns:238px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);column-gap:18px}
  body[data-diagram="flow"] .side h2{grid-column:1/-1;grid-row:1}
  body[data-diagram="flow"] .side .gauge{grid-column:1;grid-row:2;
    flex-direction:column;justify-content:center;gap:.35em}
  body[data-diagram="flow"] .side .gauge svg{height:172px;width:172px}
  body[data-diagram="flow"] .side .gauge .stack{align-items:center}
  body[data-diagram="flow"] .side .tiles{grid-column:2;grid-row:2;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr))}
  body[data-diagram="flow"] .side .tile{justify-content:center}
}

/* A narrow desktop gives the panel a side column rather than the full
   width, so there is no room for a ring beside the stats - the ring goes
   above them instead. */
@media(min-width:1001px) and (max-width:1200px) and (min-height:561px){
  body[data-diagram="flow"] .side{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr);row-gap:4px}
  body[data-diagram="flow"] .side .gauge{grid-column:1;grid-row:2;
    flex-direction:row;justify-content:center;gap:10px}
  body[data-diagram="flow"] .side .gauge svg{height:92px;width:92px}
  body[data-diagram="flow"] .side .tiles{grid-column:1;grid-row:3}
}

/* the value has to fit the tile, so it steps up with the width */
@media(min-width:1280px) and (min-height:561px){ .side{--tval:40px} }
@media(min-width:1600px) and (min-height:561px){ .side{--tval:48px} }

/* ---- the grid for each slide -------------------------------------------
   The slides own the grid. These rules sit at the end of the stylesheet so
   they win over the layout rules, and they are per breakpoint - a desktop
   area map applied at 800x480 would override the compact layout.

     power   the diagram and the live figures
     usage   the half-hourly chart, the Octopus figures and today's totals
     energy  the cumulative totals, the system details and the live figures */
@media(min-width:1001px) and (min-height:561px){
  body .dash[data-slide="power"]{
    grid-template-columns:minmax(0,2fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);
    grid-template-areas:"flow flow" "side totals"}
  body .dash[data-slide="usage"]{
    grid-template-columns:minmax(0,2fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1.45fr) minmax(0,1fr);
    grid-template-areas:"usage octopus" "today today"}
}
@media(max-width:1000px),(max-height:560px){
  body .dash[data-slide="power"]{
    grid-template-columns:minmax(0,2fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1.18fr) minmax(0,1fr);
    grid-template-areas:"flow flow" "side totals"}
  /* The chart and the Octopus figures sit side by side, and today's
     totals run the full width underneath - the same shape as the
     mock-up. */
  body .dash[data-slide="usage"]{
    grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);
    grid-template-areas:"usage octopus" "today today";
    grid-template-rows:minmax(0,1.32fr) minmax(0,1fr)}
  body .dash[data-slide="usage"] .octopus .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* the panel is narrow, so the labels need the room */
  body .dash[data-slide="usage"] .octopus .tile{padding:.45em .5em}
  body .dash[data-slide="usage"] .octopus .tile .k{letter-spacing:.02em}
  body .dash[data-slide="usage"] .today .tiles{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media(max-width:640px),(max-height:400px){
  body .dash[data-slide="power"]{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    grid-template-areas:"side"}
  /* a diagram this small is unreadable - the figures are what matter */
  body .dash[data-slide="power"] .flow{display:none}
  /* On a tiny screen each slide keeps only what it is for: the chart for
     the usage slide, the counters for the energy one. */
  body .dash[data-slide="usage"]{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    grid-template-areas:"usage"}
  body .dash[data-slide="usage"] .octopus,
  body .dash[data-slide="usage"] .today{display:none}
  /* the SoC bar does not fit here - the SoC tile carries the level */
  body .dash[data-slide="power"] .side .socbar{display:none}
}

/* ---- the weather slide ------------------------------------------------
   Right now, the solar forecast, and the week ahead.  The panels are
   laid out the same way at every size, because the mock-up was drawn
   for the 7" screen and it works there.
*/
.now,.sun,.week{display:none}
body .dash[data-slide="weather"] .flow,
body .dash[data-slide="weather"] .side,
body .dash[data-slide="weather"] .totals,
body .dash[data-slide="weather"] .system,
body .dash[data-slide="weather"] .usage,
body .dash[data-slide="weather"] .octopus,
body .dash[data-slide="weather"] .today{display:none}
body .dash[data-slide="weather"] .now,
body .dash[data-slide="weather"] .sun,
body .dash[data-slide="weather"] .week{display:flex}
.now{grid-area:now}.sun{grid-area:sun}.week{grid-area:week}
body .dash[data-slide="weather"]{
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  grid-template-rows:minmax(0,1.12fr) minmax(0,1fr);
  grid-template-areas:"now sun" "week week"}
@media(max-width:640px),(max-height:400px){
  /* too small for three panels - the conditions and the week are what
     matter, so the forecast goes */
  body .dash[data-slide="weather"]{
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"now" "week"}
  body .dash[data-slide="weather"] .sun{display:none}
  /* and the details that do not fit go as well - the screen is too
     small for six rows of them */
  body .dash[data-slide="weather"] .now .kv.opt{display:none}
  body .dash[data-slide="weather"] .now .kvs{grid-template-columns:minmax(0,1fr)}
  body .dash[data-slide="weather"] .now .kvs .kv:nth-child(n+2){display:none}
}
/* On the very smallest screens the list of details goes altogether and
   the wind rides along with the conditions instead. */
@media(max-width:420px),(max-height:280px){
  body .dash[data-slide="weather"] .now .kvs{display:none}
  body .dash[data-slide="weather"] .now .tw{display:inline;margin-left:.45em}
  /* the wind and the rain chance do not fit on a day card this small */
  body .dash[data-slide="weather"] .wday .wd,
  body .dash[data-slide="weather"] .wday .r{display:none}
  /* the padding gives way instead - the type does not shrink */
  body .dash[data-slide="weather"] .wday{padding:.2em .1em}
  body .dash[data-slide="weather"]{
    grid-template-rows:minmax(0,.9fr) minmax(0,1.1fr)}
}

/* right now */
.nowbody{display:flex;align-items:center;gap:calc(var(--gap)*1.1);flex:none}
.nowicon{width:clamp(30px,6.6vmin,56px);height:clamp(30px,6.6vmin,56px);flex:none}
.nowicon svg{width:100%;height:100%;display:block}
.nowtemp{min-width:0;flex:1 1 auto}
.nowtemp .big{font-family:var(--font-mono);font-size:clamp(28px,6.2vmin,52px);
              font-weight:300;line-height:1;letter-spacing:-.02em;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowtemp .cond{color:var(--muted);font-size:var(--fs);margin-top:.15em;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The wind is in the list of details, but on a tiny screen the list goes
   and the wind comes up next to the conditions instead. */
.nowtemp .tw{display:none}
.now .kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
          gap:0 calc(var(--gap)*1.4);margin-top:calc(var(--gap)*.7);
          flex:1 1 auto;min-height:0;align-content:start}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
    padding:.16em 0;border-bottom:1px solid var(--line);min-width:0}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);font-size:var(--fsl);white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
.kv .v{font-family:var(--font-mono);font-size:var(--fsl);color:var(--text);
       text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the solar forecast */
.sunrows{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;
         justify-content:space-evenly;gap:1px}
.sunrow{display:grid;grid-template-columns:3.1em minmax(0,1fr) 6.1em;
        align-items:center;gap:calc(var(--gap)*.7);font-size:var(--fsl)}
.sunrow .d{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sunrow .bar{position:relative;height:clamp(7px,1.3vmin,14px);
             background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;
             display:block}
.sunrow .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pv);
               opacity:.75;display:block;border-radius:3px;width:0}
.sunrow .v{font-family:var(--font-mono);text-align:right;white-space:nowrap;
           color:var(--text);font-variant-numeric:tabular-nums}
.sunrow.first .d{color:var(--text)}
.sun .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the week ahead */
.week .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
             gap:calc(var(--gap)*.6);flex:1 1 auto;min-height:0}
.wday{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
      padding:.35em .15em;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:1px;min-width:0;overflow:hidden}
.wday .d{font-size:var(--fsl);color:var(--muted);text-transform:uppercase;
         letter-spacing:.05em;white-space:nowrap;line-height:1.2}
.wday .ic{width:clamp(20px,3.8vmin,32px);height:clamp(20px,3.8vmin,32px);flex:none;
          display:block}
.wday .ic svg{width:100%;height:100%;display:block}
.wday .t{font-family:var(--font-mono);font-size:clamp(12px,1.9vmin,16px);
         font-weight:600;line-height:1.15}
.wday .lo{font-family:var(--font-mono);font-size:var(--fsl);color:var(--muted);
          line-height:1.15}
.wday .r{font-size:var(--fsl);color:var(--load);line-height:1.15;min-height:1.15em}
.wday .wd{font-size:var(--fsl);color:var(--dim);white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;max-width:100%;line-height:1.15}

</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span id="plantName">FoxESS</span><span class="sub" id="plantMeta"></span></h1>
    <div class="spacer"></div>
    <span class="pill hide-sm"><span class="dot off" id="liveDot"></span><span id="liveStatus">connecting…</span></span>
    <span class="pill mono hide-sm" id="agePill">—</span>
    <span class="pill mono" id="clockPill"><span id="clockDate"><span id="clockWd"></span><span id="clockDm"></span><span id="clockYr"></span></span><span id="clockTime">—</span></span>
    <a class="gear" href="/settings" id="gear" title="Settings">⚙</a>
  </header>

  <div id="errorBox" class="err" style="display:none"></div>

  <div class="stage">
    <div class="dash" id="dash">

    <section class="panel usage">
      <h2>Grid &mdash; last 24 hours <span class="src" id="usageSource"></span></h2>
      <div class="chartbox">
        <svg id="usageChart" viewBox="0 0 480 162" preserveAspectRatio="xMidYMid meet">
          <g id="usageBands"></g>
          <g id="usageBars"></g>
          <line id="usageAxis" x1="0" y1="140" x2="480" y2="140" stroke="rgba(255,255,255,.10)"/>
          <g id="usageTicks" fill="var(--dim)" font-size="9" font-family="var(--font-mono)"></g>
          <g id="usageScale" fill="var(--dim)" font-size="9" font-family="var(--font-mono)"></g>
          <g id="usageNow"></g>
        </svg>
      </div>
      <div class="legend" id="usageLegend"></div>
    </section>

    <section class="panel octopus">
      <h2>Octopus <span id="octTariff" style="text-transform:none;letter-spacing:0"></span>
        <span id="octLive" class="livepill" hidden></span></h2>
      <div class="tiles" id="octTiles"></div>
      <div class="hint" id="octHint"></div>
    </section>

    <section class="panel today">
      <h2>Today</h2>
      <div class="tiles" id="todayTiles"></div>
    </section>
    <section class="panel flow">
      <h2>Power flow</h2>
      <div class="flowwrap">
        <svg class="flowsvg" id="flowSvg" viewBox="0 0 900 274" preserveAspectRatio="xMidYMid meet">
          <path id="wPv"   class="wire moving" d="M178 64 H 402"/>
          <path id="wLoad" class="wire moving" d="M498 64 H 722"/>
          <path id="wGrid" class="wire moving" d="M413 95 Q370 120 330 148"/>
          <path id="wBat"  class="wire moving" d="M487 95 Q530 120 570 148"/>

          <circle class="fnode" id="fNodePv"   cx="130" cy="64"  r="48" stroke="var(--pv)"/>
          <circle class="fnode" id="fNodeInv"  cx="450" cy="64"  r="48" stroke="var(--bat)"/>
          <circle class="fnode" id="fNodeLoad" cx="770" cy="64"  r="48" stroke="var(--load)"/>
          <circle class="fnode" id="fNodeGrid" cx="330" cy="196" r="48" stroke="var(--grid)"/>
          <circle class="fnode" id="fNodeBat"  cx="570" cy="196" r="48" stroke="var(--bat)"/>

          <g class="ricon" fill="none" stroke="var(--pv)" transform="translate(130,38) scale(.8)">
            <circle cx="0" cy="0" r="6.5"/>
            <path d="M0 -12 V-17 M0 12 V17 M-12 0 H-17 M12 0 H17
                     M-8.5 -8.5 L-12 -12 M8.5 8.5 L12 12
                     M8.5 -8.5 L12 -12 M-8.5 8.5 L-12 12"/>
          </g>
          <g class="ricon" fill="none" stroke="var(--bat)" transform="translate(450,38) scale(.8)">
            <circle cx="0" cy="0" r="13"/>
            <path d="M-9 0 Q-4.5 -10 0 0 T9 0"/>
          </g>
          <g class="ricon" fill="var(--load)" stroke="none" transform="translate(770,38) scale(.8)">
            <path d="M0 -13 L14 0 H9.5 V12 H-9.5 V0 H-14 Z"/>
          </g>
          <g class="ricon" fill="none" stroke="var(--grid)" transform="translate(330,170) scale(.8)">
            <path d="M2 -12 L-9 2 H-1 L-3 12 L8 -2 H0 Z"/>
          </g>
          <g class="ricon" fill="none" stroke="var(--bat)" transform="translate(570,170) scale(.8)">
            <rect x="-10" y="-6.5" width="19" height="13" rx="2"/>

          </g>

          <text class="val"  x="130" y="74"  text-anchor="middle" id="vPv">0.00</text>
          <text class="fstat" x="130" y="92"  text-anchor="middle" id="fPvSt">Idle</text>
          <text class="fname" x="130" y="128" text-anchor="middle">SOLAR</text>

          <text class="lbl"  x="450" y="76"  text-anchor="middle" id="vModel">—</text>
          <text class="fname" x="450" y="128" text-anchor="middle">INVERTER</text>

          <text class="val"  x="770" y="74"  text-anchor="middle" id="vLoad">0.00</text>
          <text class="fstat" x="770" y="92"  text-anchor="middle" id="fLoadSt">Idle</text>
          <text class="fname" x="770" y="128" text-anchor="middle">HOUSE</text>

          <text class="val"  x="330" y="206" text-anchor="middle" id="vGrid">0.00</text>
          <text class="fstat" x="330" y="224" text-anchor="middle" id="fGridSt">Idle</text>

          <text class="val"  x="570" y="206" text-anchor="middle" id="vBat">0.00</text>
          <text class="fstat" x="570" y="224" text-anchor="middle" id="fBatSt">Idle</text>
          <text class="fname" x="570" y="260" text-anchor="middle">BATTERY</text>
        </svg>
        <svg class="flowsvg ringsvg" id="ringsSvg" viewBox="0 0 900 258" preserveAspectRatio="xMidYMid meet">
          <path id="rLinePv"   class="rwire moving" d="M183.9 68.3 Q290.0 78.3 391.3 111.7"  stroke="var(--pv)"/>
          <path id="rLineLoad" class="rwire moving" d="M508.7 111.7 Q610.0 78.3 716.1 68.3"  stroke="var(--load)"/>
          <path id="rLineGrid" class="rwire moving" d="M184.2 172.9 Q289.8 165.7 391.0 134.9" stroke="var(--grid)"/>
          <path id="rLineBat"  class="rwire moving" d="M509.0 134.9 Q610.2 165.7 715.8 172.9" stroke="var(--bat)"/>

          <circle class="rnode" id="rRingPv"   cx="135" cy="58"  r="50" stroke="var(--pv)"/>
          <circle class="rnode" id="rRingLoad" cx="765" cy="58"  r="50" stroke="var(--load)"/>
          <circle class="rnode" id="rRingGrid" cx="135" cy="182" r="50" stroke="var(--grid)"/>
          <circle class="rnode" cx="765" cy="182" r="50" stroke="none"/>
          <circle class="rnode" cx="450" cy="124" r="60" stroke="none"/>
          <circle class="rtrack" id="rTrackBat" cx="765" cy="182" r="50"/>
          <circle class="rtrack" id="rTrackHub" cx="450" cy="124" r="60"/>
          <circle class="rarc" id="rRingBat"  cx="765" cy="182" r="50" pathLength="100"
                  stroke="var(--bat)" stroke-dasharray="0 100"
                  transform="rotate(-90 765 182)"/>
          <circle class="rarc" id="rRingHub"  cx="450" cy="124" r="60" pathLength="100"
                  stroke="var(--bat)" stroke-dasharray="0 100"
                  transform="rotate(-90 450 124)"/>

          <g id="rIcoPv" class="ricon" fill="none" stroke="var(--pv)" transform="translate(135,30)">
            <circle cx="0" cy="0" r="6.5"/>
            <path d="M0 -12 V-17 M0 12 V17 M-12 0 H-17 M12 0 H17
                     M-8.5 -8.5 L-12 -12 M8.5 8.5 L12 12
                     M8.5 -8.5 L12 -12 M-8.5 8.5 L-12 12"/>
          </g>
          <g id="rIcoLoad" class="ricon" fill="var(--load)" stroke="none" transform="translate(765,30)">
            <path d="M0 -13 L14 0 H9.5 V12 H-9.5 V0 H-14 Z"/>
          </g>
          <g id="rIcoGrid" class="ricon" fill="none" stroke="var(--grid)" transform="translate(135,154)">
            <path d="M2 -12 L-9 2 H-1 L-3 12 L8 -2 H0 Z"/>
          </g>
          <g id="rIcoBat" class="ricon" fill="none" stroke="var(--bat)" transform="translate(765,154)">
            <rect x="-12" y="-7.5" width="24" height="15" rx="2"/>
            <path d="M14 -3 H16.5 V3 H14"/>
            <rect id="rBatFill" x="-10.8" y="-6.3" width="0" height="12.6" rx="1"
                  fill="var(--bat)" stroke="none"/>
          </g>
          <g id="rIcoHub" class="ricon" transform="translate(450,94)">
            <circle cx="0" cy="0" r="13" fill="none"/>
            <path d="M-9 0 Q-4.5 -10 0 0 T9 0" fill="none"/>
          </g>

          <text class="rval"    x="135" y="70"  text-anchor="middle" id="rPvVal">0.00</text>
          <text class="rstatus" x="135" y="88"  text-anchor="middle" id="rPvSt">Idle</text>
          <text class="rname"   x="135" y="125" text-anchor="middle">SOLAR</text>

          <text class="rval"    x="765" y="70"  text-anchor="middle" id="rLoadVal">0.00</text>
          <text class="rstatus" x="765" y="88"  text-anchor="middle" id="rLoadSt">Idle</text>
          <text class="rname"   x="765" y="125" text-anchor="middle">HOUSE</text>

          <text class="rval"    x="135" y="198" text-anchor="middle" id="rGridVal">0.00</text>
          <text class="rstatus" x="135" y="216" text-anchor="middle" id="rGridSt">Idle</text>
          <text class="rname"   x="135" y="249" text-anchor="middle">GRID</text>

          <text class="rval"    x="765" y="198" text-anchor="middle" id="rBatVal">0.00</text>
          <text class="rstatus" x="765" y="216" text-anchor="middle" id="rBatSt">Idle</text>
          <text class="rname"   x="765" y="249" text-anchor="middle">BATTERY</text>

          <text class="rval"   x="450" y="140" text-anchor="middle" id="rHubVal">0%</text>
          <text class="rstatus" x="450" y="160" text-anchor="middle" id="rHubSt">idle</text>
          <text class="rhub"   x="450" y="201" text-anchor="middle">INVERTER</text>
          <text class="rstatus" x="450" y="217" text-anchor="middle" id="rHubModel">-</text>

          <circle id="socArc" cx="60" cy="60" r="50" fill="none" stroke="var(--bat)"
                  stroke-width="9" stroke-linecap="round" pathLength="100"
                  stroke-dasharray="0 100" transform="rotate(-90 60 60)"/>
          <g id="socFloor"><circle cx="60" cy="10" r="5" fill="var(--alarm)"/></g>
          <text class="big" id="socText" x="60" y="70" text-anchor="middle">—</text>

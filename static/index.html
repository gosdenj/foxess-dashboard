<script>
const $ = id => document.getElementById(id);
const num = (v,d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—"
                      : Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const int = v => (v===null||v===undefined) ? "—" : Math.round(v).toLocaleString();

let CFG = {display:{}};
let UNITS = "kW";
const UI = {};

// Only touch the DOM when a value actually changed - on a Pi 3 every
// needless write costs a style recalculation.
function setText(el, text){
  if(el && el.textContent !== text) el.textContent = text;
}
function setAttr(el, name, value){
  if(el && el.getAttribute(name) !== value) el.setAttribute(name, value);
}

/* How healthy is the pack right now?
   green while it is comfortably charged, amber when it is getting low, and
   red once it has reached the inverter's own minimum. */
function battHealth(soc, floor){
  const lvl = (soc===undefined || soc===null || isNaN(soc)) ? null
            : Math.max(0, Math.min(100, soc));
  if(lvl===null) return {lvl:0, colour:"var(--muted)", cls:"", known:false};
  const min = (floor===undefined || floor===null) ? 10 : floor;
  if(lvl<=min)       return {lvl, colour:"var(--alarm)", cls:"crit",  known:true};
  if(lvl<40)         return {lvl, colour:"var(--pv)",    cls:"low",   known:true};
  return {lvl, colour:"var(--bat)", cls:"charged", known:true};
}

function applyDisplay(){
  const d = CFG.display || {};
  const theme = d.theme === "auto"
    ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
    : (d.theme || "dark");
  document.documentElement.dataset.theme = theme;
  document.body.dataset.layout = (d.layout || "auto");
  document.body.dataset.diagram = (d.diagram || "flow");
  document.body.classList.toggle("no-totals", d.show_totals === false);
  document.body.classList.toggle("no-system", d.show_system === false);
  document.body.classList.toggle("no-soc",    d.show_soc === false);
  UNITS = d.units === "W" ? "W" : "kW";
}

function setWire(id,color,active,dir){
  const el = $(id);
  el.setAttribute("stroke", color);
  el.style.opacity = active ? ".9" : ".22";
  el.classList.toggle("moving", active);
  if (active) el.style.animationDirection = (dir === "rev") ? "reverse" : "normal";
}

// Convert kW -> the configured display unit
function P(kw){ return UNITS === "W" ? kw*1000 : kw; }
function unit(){ return UNITS; }
function fmtP(kw){ return num(P(kw), UNITS === "W" ? 0 : 2); }

function render(s){
  window.SNAP = s;
  const L = s.live||{}, M = s.meta||{}, T = s.totals||{};
  if (s.settings && s.settings.display){ CFG = s.settings; applyDisplay(); }

  $("plantName").textContent = M.plant_name || "FoxESS";
  // The header carries the station identifier.  The datalogger's model
  // ("WLan-WW (WiFi & LAN)") is not much use up here - it is in the
  // system panel - and the space is better spent on the date.
  $("plantMeta").textContent = M.inverter_sn || "";
  if(s.build && !$("gear").dataset.build){
    $("gear").dataset.build = s.build;
    $("gear").title = "Settings \u00b7 build " + s.build;
  }
  $("liveDot").className = "dot " + (s.connected ? "on" : "off");
  $("liveStatus").textContent = s.connected ? "LIVE" : "offline";
  $("agePill").textContent = (s.live_age_s!=null) ? s.live_age_s.toFixed(1)+"s" : "—";
  const tz = (CFG.display && CFG.display.timezone && CFG.display.timezone!=="auto")
             ? CFG.display.timezone : undefined;
  const now = new Date((s.server_time||0)*1000);
  // The date is with the time, because the top of the screen is the one
  // part of the dashboard that stays put while the slides change.  The
  // parts are asked for separately: en-GB puts a comma between the
  // weekday and the date, and there is no room for it.  The weekday is
  // in a span of its own because a small screen drops it.
  const wd = now.toLocaleDateString("en-GB", {weekday:"short", timeZone:tz});
  const dm = now.toLocaleDateString("en-GB", {day:"2-digit", month:"short", timeZone:tz});
  const yr = now.toLocaleDateString("en-GB", {year:"numeric", timeZone:tz});  $("clockWd").textContent = wd;
  $("clockDm").textContent = dm;
  $("clockYr").textContent = yr;
  $("clockTime").textContent = now.toLocaleTimeString(
      "en-GB", {hour:"2-digit",minute:"2-digit",hour12:(CFG.display?.clock==="12h"),timeZone:tz});

  if (s.api_error){
    const b = $("errorBox"); b.style.display="block"; b.textContent="Open API: "+s.api_error;
  } else $("errorBox").style.display="none";

  const pv=L.pvPower??0, load=L.loadsPower??0, imp=L.gridConsumptionPower??0,
        exp=L.feedinPower??0, chg=L.batChargePower??0, dis=L.batDischargePower??0,
        soc=L.SoC;

  $("vPv").textContent   = fmtP(pv);
  $("vLoad").textContent = fmtP(load);
  $("vGrid").textContent = fmtP(imp-exp);
  $("vBat").textContent  = fmtP(dis-chg);
  $("vModel").textContent = M.manager_version ? "fw "+M.manager_version : "—";

  setWire("wPv","var(--pv)", pv>0.02, "fwd");
  setWire("wLoad","var(--load)", load>0.02, "fwd");
  setWire("wGrid","var(--grid)", (imp+exp)>0.02, imp>exp ? "rev" : "fwd");
  // the wire is drawn from the inverter to the battery, so forward means
  // charging; a discharge has to run backwards
  setWire("wBat","var(--bat)", (chg+dis)>0.02, dis>chg ? "rev" : "fwd");

  $("fPvSt").textContent   = pv>0.02   ? "Producing" : "Idle";
  $("fLoadSt").textContent = load>0.02 ? "Using" : "Idle";
  $("fGridSt").textContent = imp>0.02 ? "Importing"
                             : exp>0.02 ? "Exporting" : "Idle";
  $("fBatSt").textContent  = dis>0.02 ? "Discharging"
                             : chg>0.02 ? "Charging" : "Idle";

  const self = load>0.05 ? Math.max(0,Math.min(1,(load-imp)/load)) : 1;
  const hint = load>0.05
    ? "Self-sufficiency "+Math.round(self*100)+"% · "+(imp>0.02?"drawing "+fmtP(imp)+" "+unit()+" from the grid":"running on your own power")
    : "No household load detected.";
  $("flowHint").textContent = hint;
  $("flowHint2").textContent = hint;

  renderRings(s);
  applySlide(s.slide);
  renderUsage(s.usage || {}, s.mini || {});
  renderOctopus(s.octopus || {}, s.mini || {});
  renderToday(s.usage || {});
  renderWeather(s.weather || {});

  const tiles=[
    {k:"Solar",c:"var(--pv)",v:fmtP(pv),n:pv>0.02?"generating":"no output"},
    {k:"House",c:"var(--load)",v:fmtP(load),n:"consuming"},
    {k:"Grid",c:"var(--grid)",v:fmtP(imp-exp),n:imp>0.02?"importing":exp>0.02?"exporting":"idle"},
    {k:"Batt",c:"var(--bat)",v:fmtP(dis-chg),n:dis>0.02?"discharging":chg>0.02?"charging":"idle"},
    {k:"SoC",c:"var(--bat)",v:soc!==undefined?num(soc,0):"—",u:"%",n:soc!==undefined&&M.min_soc!==undefined?"floor "+M.min_soc+"%":""},
  ];
  if(!UI.tilesBuilt){ UI.tilesBuilt=true;
    $("tiles").innerHTML = tiles.map((t,i)=>
      `<div class="tile${i===4?" soc":""}"><div class="k"><span class="swatch" id="sw${i}" style="background:${t.c}"></span>${t.k}</div>
       <div class="v"><span class="vnum"></span>${t.u?`<small>${t.u}</small>`:""}</div><div class="note"></div></div>`).join("");
    UI.tileVals = [...$("tiles").querySelectorAll(".vnum")];
    UI.tileNotes= [...$("tiles").querySelectorAll(".note")];
  }
  tiles.forEach((t,i)=>{ setText(UI.tileVals[i], t.v); setText(UI.tileNotes[i], t.n); });
  // the SoC tile wears the health colour, like the rings do
  if(soc!==undefined){
    const hc = battHealth(soc, M.min_soc ?? 10).colour;
    setAttr($("sw4"), "style", "background:"+hc);
    if(UI.tileVals[4]) UI.tileVals[4].style.color = hc;
  }

  if (soc!==undefined){
    const pct = Math.max(0,Math.min(100,soc));
    const floor = M.min_soc ?? 10;
    const h = battHealth(soc, floor);
    setAttr($("socArc"), "stroke-dasharray", pct+" 100");
    setAttr($("socArc"), "stroke", h.colour);
    $("socText").textContent = num(soc,0)+"%";
    $("socText").style.color = h.colour;
    const atFloor = pct<=floor+0.5;
    $("socCap").textContent = "floor "+floor+"% · "+(atFloor?"at minimum — grid takes over":"above floor");
    if(UI.floor !== floor){
      UI.floor = floor;
      const a = (floor/100) * 2 * Math.PI;
      $("socFloor").innerHTML = `<circle cx="${(60+50*Math.sin(a)).toFixed(1)}" cy="${(60-50*Math.cos(a)).toFixed(1)}" r="5" fill="var(--alarm)"/>`;
    }
    // slim bar (compact layouts)
    $("socFill").style.width = pct+"%";
    $("socFill").style.background = h.colour;
    $("socFloorBar").style.left = "calc("+floor+"% - 1.5px)";
    $("socBarCap").textContent = "SoC "+num(soc,0)+"% · floor "+floor+"%"
                              + (atFloor?" · at minimum":"");
  }

  renderDaily(s);

  const sys=[
    ["Inverter serial", M.inverter_sn||"—"],
    ["Data logger", [M.datalogger,M.datalogger_version?"v"+M.datalogger_version:null].filter(Boolean).join(" ")||"—"],
    ["Signal", M.signal!==undefined?M.signal+" / 100":"—"],
    ["Firmware", [M.manager_version?"Mgr "+M.manager_version:null,M.master_version?"Mast "+M.master_version:null,
                  M.slave_version?"Slv "+M.slave_version:null].filter(Boolean).join(" · ")||"—"],
    ["Battery units", M.battery_units?M.battery_units+" ("+(M.battery_types||[]).join(", ")+")":"—"],
    ["Minimum SoC", M.min_soc!==undefined?M.min_soc+" % (grid "+M.min_soc_on_grid+" %)":"—"],
    ["Power station", M.plant_name||"—"],
    ["Timezone", M.plant_timezone||"—"],
    ["Plant id", M.plant_id||"—"],
    ["WS messages", s.messages||0],
    ["Open API age", s.api_age_s!=null?s.api_age_s.toFixed(0)+"s":"—"],
    ["API quota", M.quota&&M.quota.remaining!==undefined?String(M.quota.remaining):"—"],
  ];
  if(!UI.sysBuilt){ UI.sysBuilt=true;
    $("system").querySelector("tbody").innerHTML =
      sys.map(r=>`<tr><td class="k">${r[0]}</td><td class="v"></td></tr>`).join("");
    UI.sysVals = [...$("system").querySelectorAll("td.v")];
  }
  sys.forEach((r,i)=> setText(UI.sysVals[i], r[1]));
}

let sseOk = false;

/* ---- rings diagram ------------------------------------------------------
   A hub (the inverter, showing self-sufficiency) with four satellites.
   Flow lines only appear when power is actually moving, so an idle system
   stays calm instead of flickering. */
function renderRings(s){
  const L=s.live||{}, M=s.meta||{};
  const pv=+(L.pvPower||0), load=+(L.loadsPower||0);
  const imp=+(L.gridConsumptionPower||0), exp=+(L.feedinPower||0);
  const chg=+(L.batChargePower||0), dis=+(L.batDischargePower||0);
  const soc=+(L.SoC||0);

  // -- the battery state, shared by the hub and the battery node --
  const floor = (M.min_soc!==undefined ? M.min_soc : 10);
  const h = battHealth(soc, floor);
  const hasSoc = h.known;
  const lvl = h.lvl;
  const health = h.colour;
  const healthClass = h.cls;
  const activity = dis>0.02 ? "Discharging" : chg>0.02 ? "Charging" : "Idle";

  // -- hub: the state of charge, right in the middle of the screen --
  setText($("rHubVal"), hasSoc ? Math.round(lvl)+"%" : "—");
  setText($("rHubSt"), hasSoc ? activity.toLowerCase() : "no reading");
  setText($("rHubModel"), M.manager_version ? "fw "+M.manager_version : "-");
  setAttr($("rRingHub"), "stroke", health);
  setAttr($("rRingHub"), "stroke-dasharray", Math.round(lvl)+" 100");
  setAttr($("rHubVal"), "class", "rval "+healthClass);
  setAttr($("rIcoHub"), "stroke", health);

  // -- solar --
  setText($("rPvVal"), fmtP(pv));
  setText($("rPvSt"), pv>0.02 ? "Producing" : "Idle");
  ringWire("rLinePv", pv>0.02, false);

  // -- house --
  setText($("rLoadVal"), fmtP(load));
  setText($("rLoadSt"), load>0.02 ? "Using" : "Idle");
  ringWire("rLineLoad", load>0.02, false);

  // -- grid: import comes in, export goes out --
  const net = imp-exp;
  setText($("rGridVal"), fmtP(Math.abs(net)));
  setText($("rGridSt"), imp>0.02 ? "Importing" : exp>0.02 ? "Exporting" : "Idle");
  // grid -> hub, so forward means importing; an export runs backwards
  ringWire("rLineGrid", (imp+exp)>0.02, exp>imp);

  // -- battery: discharge out, charge in --
  const bnet = dis-chg;
  setText($("rBatVal"), fmtP(Math.abs(bnet)));
  setText($("rBatSt"), activity);
  // hub -> battery, so forward means charging; a discharge runs backwards
  ringWire("rLineBat", (chg+dis)>0.02, dis>chg);
  // the ring is a level gauge, coloured by how healthy the pack is
  setAttr($("rRingBat"), "stroke", health);
  setAttr($("rRingBat"), "stroke-dasharray", Math.round(lvl)+" 100");
  setAttr($("rIcoBat"), "stroke", health);
  // and the icon fills up to the state of charge, left to right
  if(hasSoc){
    setAttr($("rBatFill"), "width", String(Math.round(21.6 * lvl/100)));
    setAttr($("rBatFill"), "fill", health);
  }
}

/* Show or hide a flow line, and point it the right way. */
function ringWire(id, active, reverse){
  const el = $(id);
  if(!el) return;
  if(active !== el.dataset.on){
    el.dataset.on = active ? "1" : "";
    el.style.display = active ? "" : "none";
  }
  const rev = reverse ? "rev" : "";
  if(el.dataset.dir !== rev){
    el.dataset.dir = rev;
    el.classList.toggle("rev", reverse);
  }
}


/* ---- slides ------------------------------------------------------------
   The server owns which slide is showing, so every display - the Pi kiosk,
   a phone, the ESP32 - shows the same one at the same moment. */
let LAST_SLIDE = "";
let SLIDE_ANIM = null;
let GHOST = null;

/* A slide change is a card being dealt onto a deck.

   The slide that is leaving is copied before the new one is put in
   place, and the copy is left sitting in the stage behind the new
   slide.  The new slide then comes in over the top of it from the
   right, while the copy dissolves underneath.  That way the old slide
   is never simply blanked out - it is still there, fading, until the
   new one has covered it.

   The copy is put in the stage after the live slide rather than before
   it, because the copy has the same element ids in it as the live
   slide and the live one must be the one that getElementById finds.

   The animation is started from here rather than from a rule in the
   stylesheet, because a CSS animation runs once and then keeps its
   final state: the rule for a slide stays matched while that slide is
   showing, so the animation would not run again on the next change of
   slide.  Starting it here means every change gets one. */
function slideTransition(ghost){
  const dash = $("dash");
  /* Someone who has asked for less movement should not get any. */
  const still = window.matchMedia
             && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* The copy dissolves under the slide that is arriving.  It is a
     little slower than the slide itself, so the old one is still
     faintly visible for a moment after the new one has landed. */
  if(ghost){
    if(still || !ghost.animate) ghost.remove();
    else{
      const g = ghost.animate(
        [{opacity:1, transform:"translateX(0)"},
         {opacity:0, transform:"translateX(0)"}],
        {duration:560, delay:60, easing:"ease-in-out"});
      g.onfinish = () => { ghost.remove(); if(GHOST===ghost) GHOST = null; };
    }
  }

  if(!dash || !dash.animate || still) return;
  if(SLIDE_ANIM) SLIDE_ANIM.cancel();
  dash.classList.add("dealing");
  SLIDE_ANIM = dash.animate(
    [{transform:"translateX(100%)", opacity:.8},
     {transform:"translateX(0)", opacity:1}],
    {duration:420, easing:"cubic-bezier(.22,.61,.36,1)"});
  SLIDE_ANIM.onfinish = () => dash.classList.remove("dealing");
}

function applySlide(slide){
  if(!slide || !slide.name) return;
  if(slide.name === LAST_SLIDE) return;
  const dash = $("dash");
  const stage = document.querySelector(".stage");
  const leaving = LAST_SLIDE;
  LAST_SLIDE = slide.name;
  document.body.dataset.slide = slide.name;

  /* Copy the slide that is on its way out.  It is copied before the
     new slide is put in place, so it still holds the old slide. */
  let ghost = null;
  if(stage && dash && leaving){
    if(GHOST) GHOST.remove();
    ghost = dash.cloneNode(true);
    ghost.removeAttribute("id");
    ghost.classList.remove("dealing");
    ghost.classList.add("ghost");
    stage.appendChild(ghost);
    GHOST = ghost;
  }

  /* The slide draws its own layout, so which slide is showing is
     written on the slide itself.  The copy keeps the old name, which
     is how it stays showing the old slide. */
  if(dash) dash.dataset.slide = slide.name;

  slideTransition(ghost);
}

/* ---- the weather slide ------------------------------------------------
   The icons are drawn here rather than fetched, so the slide needs
   nothing on disk but the forecast itself. */
const WX_CLOUD = `<path d="M14 36h20a7 7 0 0 0 1-13.9A10 10 0 0 0 16 24.6 6 6 0 0 0 14 36z" fill="var(--text)" opacity=".92"/>`;
const WX_SUN = `<circle cx="24" cy="24" r="8.5" fill="var(--pv)"/>
  <g stroke="var(--pv)" stroke-width="2.4" stroke-linecap="round">
  <path d="M24 8v5M24 35v5M8 24h5M35 24h5M12.7 12.7l3.5 3.5M31.8 31.8l3.5 3.5M35.3 12.7l-3.5 3.5M16.2 31.8l-3.5 3.5"/></g>`;
const WX_RAIN = `<g stroke="var(--load)" stroke-width="2.6" stroke-linecap="round"><path d="M17 40l-2 5M25 40l-2 5M33 40l-2 5"/></g>`;
const WX_DRIZZLE = `<g stroke="var(--load)" stroke-width="2.2" stroke-linecap="round"><path d="M18 39l-1 3M25 39l-1 3M32 39l-1 3"/></g>`;
const WX_FOG = `<g stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" opacity=".85"><path d="M10 40h28M13 45h22"/></g>`;
const WX_SNOW = `<g stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round"><path d="M17 41v6M14 43h6M25 41v6M22 43h6M33 41v6M30 43h6"/></g>`;
const WX_SLEET = `<g stroke-linecap="round" stroke-width="2.2"><path d="M17 41v6M14 43h6" stroke="#7dd3fc"/><path d="M25 40l-1 3M32 40l-1 3" stroke="var(--load)"/></g>`;
const WX_BOLT = `<path d="M26 37l-6 7h5l-2 6 7-8h-5l3-5z" fill="var(--pv)"/>`;

const WX_ICONS = {
  sun: WX_SUN,
  partly: `<g transform="translate(-4,-4) scale(.78)">${WX_SUN}</g><g transform="translate(4,5) scale(.92)">${WX_CLOUD}</g>`,
  cloud: WX_CLOUD,
  fog: WX_CLOUD + WX_FOG,
  drizzle: WX_CLOUD + WX_DRIZZLE,
  rain: WX_CLOUD + WX_RAIN,
  snow: WX_CLOUD + WX_SNOW,
  sleet: WX_CLOUD + WX_SLEET,
  storm: WX_CLOUD + WX_BOLT,
};

function wxSvg(name){
  return `<svg viewBox="0 0 48 48" fill="none">${WX_ICONS[name] || WX_ICONS.cloud}</svg>`;
}

/* Set an icon, but only when it has really changed - the whole slide is
   redrawn on every live update, and a Pi 3 notices. */
function setIcon(el, name){
  if(!el) return;
  const key = name || "cloud";
  if(el.dataset.icon === key) return;
  el.dataset.icon = key;
  el.innerHTML = wxSvg(key);
}

function renderWeather(w){
  const days = (w && w.days) || [];
  const cur  = (w && w.current) || {};
  const solar= (w && w.solar) || {};
  const units= (w && w.units) || {};
  const windUnit = units.wind || "km/h";
  // The units that are set in the settings, rather than a guess made
  // here - the slide has to say what the numbers actually are.
  const tempUnit = units.temperature || "°C";
  const precipUnit = units.precipitation || "mm";
  const loc = (w && w.location) || {};

  if(!UI.wxBuilt){
    UI.wxBuilt = true;
    // The last three are the first to go when the screen is small - the
    // temperature, the wind and the rain matter more.
    $("wxKvs").innerHTML = [["Feels like",0],["Wind",0],["Rain now",0],
                            ["Humidity",1],["Sun",1],["UV index",1]]
      .map(([k,opt])=>`<div class="kv${opt?" opt":""}"><span class="k">${k}</span><span class="v"></span></div>`).join("");
    UI.wxKvVals = [...$("wxKvs").querySelectorAll(".v")];
    $("wxRows").innerHTML = Array.from({length:7},()=>
      `<div class="sunrow"><span class="d"></span><span class="bar"><i></i></span><span class="v"></span></div>`).join("");
    UI.wxRows = [...$("wxRows").querySelectorAll(".sunrow")];
    $("wxDays").innerHTML = Array.from({length:7},()=>
      `<div class="wday"><span class="d"></span><span class="ic"></span><span class="t"></span><span class="lo"></span><span class="r"></span><span class="wd"></span></div>`).join("");
    UI.wxDays = [...$("wxDays").querySelectorAll(".wday")];
  }

  setText($("wxPlace"), loc.name || "");
  setText($("wxAttribution"), (w && w.attribution) || "");

  const empty = !days.length;
  setText($("wxTemp"), cur.temperature!=null ? Math.round(cur.temperature)+tempUnit : "—");
  setText($("wxText"), empty ? ((w && w.error) || "no forecast") : (cur.text || "—"));
  setText($("wxWind"), cur.wind!=null
    ? Math.round(cur.wind)+" "+windUnit+(cur.wind_text?" "+cur.wind_text:"") : "");
  setIcon($("wxIcon"), empty ? "cloud" : cur.icon);

  const today = days[0] || {};
  const kvs = [
    cur.apparent!=null ? Math.round(cur.apparent)+tempUnit : "—",
    cur.wind!=null ? Math.round(cur.wind)+" "+windUnit+(cur.wind_text?" "+cur.wind_text:"") : "—",
    cur.precipitation!=null ? Number(cur.precipitation).toFixed(1)+" "+precipUnit : "—",
    cur.humidity!=null ? Math.round(cur.humidity)+"%" : "—",
    (today.sunrise && today.sunset) ? today.sunrise+" – "+today.sunset : "—",
    today.uv!=null ? Number(today.uv).toFixed(1) : "—",
  ];
  kvs.forEach((v,i)=> setText(UI.wxKvVals[i], v));

  /* -- the solar forecast --
     Before the array has been fitted against the inverter's own yield,
     what the forecast knows is the sun - so that is what is shown. */
  const calibrated = !!solar.calibrated;
  const maxPv = Math.max(0.01, ...days.map(d=> (calibrated && d.pv!=null ? Number(d.pv) : Number(d.poa)||0)));
  days.forEach((d,i)=>{
    const row = UI.wxRows[i];
    if(!row) return;
    setText(row.querySelector(".d"), i===0 ? "Today" : (d.weekday || ""));
    if(row.classList.contains("first") !== (i===0)) row.classList.toggle("first", i===0);
    const value = calibrated ? (d.pv!=null ? Number(d.pv) : null) : (d.poa!=null ? Number(d.poa) : null);
    const bar = row.querySelector(".bar i");
    if(bar){
      const width = (value!=null ? (value/maxPv*100) : 0);
      const shown = width.toFixed(1)+"%";
      if(bar.style.width !== shown) bar.style.width = shown;
    }
    setText(row.querySelector(".v"), value!=null
      ? value.toFixed(1)+(calibrated ? " kWh" : " kWh/m²") : "—");
  });
  for(let i=days.length;i<UI.wxRows.length;i++){
    const row = UI.wxRows[i];
    if(row && row.style.display !== "none") row.style.display = "none";
  }
  for(let i=0;i<days.length;i++){
    const row = UI.wxRows[i];
    if(row && row.style.display) row.style.display = "";
  }

  setText($("wxCalib"), calibrated ? "kWh, your array" : "kWh/m² of sun");
  let hint = "";
  if(calibrated){
    const kwp = solar.kwp!=null ? Number(solar.kwp).toFixed(1)+" kWp" : "";
    hint = "array ≈ "+kwp+" · "+(solar.days||0)+" days fitted";
    if(solar.array_kwp){
      hint += " · your "+Number(solar.array_kwp).toFixed(1)+" kWp "
            + (solar.agrees ? "agrees" : "differs - check the roof angle");
    }
  }else{
    hint = (solar.reason || solar.note || "waiting for enough days of your own yield");
  }
  setText($("wxHint"), hint);

  /* -- the week ahead -- */
  days.forEach((d,i)=>{
    const card = UI.wxDays[i];
    if(!card) return;
    setText(card.querySelector(".d"), i===0 ? "Today" : (d.weekday || ""));
    setIcon(card.querySelector(".ic"), d.icon);
    setText(card.querySelector(".t"), d.tmax!=null ? Math.round(d.tmax)+tempUnit : "—");
    setText(card.querySelector(".lo"), d.tmin!=null ? Math.round(d.tmin)+tempUnit : "—");
    setText(card.querySelector(".r"), d.precip_prob ? Math.round(d.precip_prob)+"%" : "");
    setText(card.querySelector(".wd"),
      d.wind!=null ? Math.round(d.wind)+" "+windUnit+" "+(d.wind_text||"") : "");
  });
  for(let i=days.length;i<UI.wxDays.length;i++){
    const card = UI.wxDays[i];
    if(card && card.style.display !== "none") card.style.display = "none";
  }
  for(let i=0;i<days.length;i++){
    const card = UI.wxDays[i];
    if(card && card.style.display) card.style.display = "";
  }
}

/* ---- the usage chart ---------------------------------------------------
   Half-hourly house usage, recorded locally from the live feed. The shaded
   bands are the Flux windows: cheap overnight, peak in the evening. */
function renderUsage(o, mini){
  let series = ((o && o.series) || []).slice();
  const bands = (o && o.bands) || [];
  const bars = $("usageBars"), ticks = $("usageTicks"),
        bandG = $("usageBands"), nowG = $("usageNow");

  /* The chart is about the grid, because that is what the tariff is
     about.  The house's own use is on the Today row underneath - and
     it does not move when the battery covers the house, which is
     exactly what you would want to see on a chart like this. */

  /* The meter's own half-hourly readings are the authority on what
     crossed the grid boundary, so where they exist they win over the
     inverter's estimate. */
  const meter = (mini && mini.today && mini.today.series) || [];
  let granularity = (o && o.granularity) || "half_hour";
  if(meter.length) series = mergeMeter(series, meter, granularity);

  /* The chart is drawn at the size it actually has, rather than being
     stretched to fit.  Stretching squashes the bars and makes the whole
     thing look the wrong shape. */
  const chart = $("usageChart");
  const box = chart.parentElement;
  const W = Math.max(240, Math.round(box.clientWidth || 480));
  const H = Math.max(80, Math.round(box.clientHeight || 162));
  chart.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const plot = H - 24;              /* the room the tick labels need */
  const mid = Math.round(plot/2);   /* the zero line: import above, export below */
  const span = 24*3600*1000;       /* the chart is a timeline of a day */
  const t0 = Date.now() - span;
  const slots = granularity === "hour" ? 24 : 48;
  const slotW = W/slots;
  const half = 1800*1000;

  const bandHtml = bands.map(b => {
    const t1 = Date.parse(b.start), t2 = Date.parse(b.end);
    if(!isFinite(t1)) return "";
    const x = ((t1 - t0)/span) * W;
    const x1 = isFinite(t2) ? ((t2 - t0)/span) * W : x + slotW;
    if(x1 < 0 || x > W) return "";
    return `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0,x1-x).toFixed(1)}" height="${plot.toFixed(1)}" fill="${b.fill}"/>`;
  }).join("");
  bandG.innerHTML = bandHtml;

  const shown = series.filter(r => r && r.start);
  const peakIn = Math.max(0, ...shown.map(r => r.grid_in||0));
  const peakOut = Math.max(0, ...shown.map(r => r.grid_out||0));
  const max = Math.max(0.25, peakIn, peakOut);

  /* The chart is a timeline of the last 24 hours, so each bar is placed
     where it actually happened rather than spread evenly.  A history
     that is only a few hours old then looks like a few hours of a day,
     which is what it is. */
  bars.innerHTML = shown.map(r => {
    const when = Date.parse(r.start);
    if(!isFinite(when)) return "";
    const x = ((when - t0)/span) * W;
    if(x < -slotW || x > W) return "";
    const w = Math.max(2, slotW-4);
    const up = Math.round((mid-4) * ((r.grid_in||0)/max));
    const down = Math.round((plot-mid-4) * ((r.grid_out||0)/max));
    let out = "";
    if(up > 0) out += `<rect x="${(x+2).toFixed(1)}" y="${(mid-up).toFixed(1)}" width="${w.toFixed(1)}" height="${up}" rx="2" fill="var(--grid)"/>`;
    if(down > 0) out += `<rect x="${(x+2).toFixed(1)}" y="${mid}" width="${w.toFixed(1)}" height="${down}" rx="2" fill="var(--bat)"/>`;
    return out;
  }).join("");

  // the axis: every six hours
  const marks = [];
  for(let h=0; h<=24; h+=6){
    const t = new Date(t0 + h*3600*1000);
    const x = (h/24)*W;
    marks.push(`<text x="${x.toFixed(1)}" y="${(H-6).toFixed(1)}">${t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</text>`);
  }
  ticks.innerHTML = marks.join("");

  /* The vertical scale: what the bars are, and how big the biggest one
     is.  The chart is energy, so the unit is kWh. */
  const scale = $("usageScale");
  if(shown.length){
    const unit = granularity === "hour" ? "kWh per hour" : "kWh per half hour";
    const peak = peakIn >= peakOut ? peakIn : peakOut;
    const peakLabel = peakIn >= peakOut ? "peak import" : "peak export";
    scale.innerHTML =
      `<text x="2" y="10">${unit}</text>` +
      `<text x="${(W-9).toFixed(1)}" y="10" text-anchor="end">${peakLabel} ${fmtP(peak)} kWh</text>`;
  }else{
    scale.innerHTML = "";
  }

  const axis = $("usageAxis");
  if(axis){ axis.setAttribute("x1", 0); axis.setAttribute("x2", W);
            axis.setAttribute("y1", mid.toFixed(1));
            axis.setAttribute("y2", mid.toFixed(1)); }

  nowG.innerHTML = shown.length ? `<line x1="${(W-2).toFixed(1)}" y1="0" x2="${(W-2).toFixed(1)}" y2="${(plot).toFixed(1)}" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
      <circle cx="${(W-2).toFixed(1)}" cy="6" r="3" fill="rgba(255,255,255,.5)"/>` : "";

  $("usageLegend").innerHTML = shown.length
    ? `<span><i style="background:var(--grid)"></i>grid import</span>
       <span><i style="background:var(--bat)"></i>grid export</span>
       <span><i style="background:rgba(125,211,252,.45)"></i>cheap 02:00-05:00</span>
       <span><i style="background:rgba(240,168,104,.55)"></i>peak 16:00-19:00</span>`
    : `<span>building history - one half-hour at a time</span>`;
  // where the numbers came from, so the chart cannot be mistaken for
  // something it is not
  $("usageSource").textContent = meter.length
    ? "from your Octopus meter" : "from the inverter";
}

/* Put the meter's own readings over the inverter's estimate, where the
   two cover the same time.  The meter's readings are half-hourly, so
   on an hourly chart they are added up to their hour. */
function mergeMeter(series, meter, granularity){
  const half = 1800*1000;
  const buckets = {};
  for(const p of meter){
    const t = Date.parse(p.t);
    if(!isFinite(t)) continue;
    const key = granularity === "hour"
      ? Math.floor(t/(60*60*1000))*(60*60*1000)
      : Math.floor(t/half)*half;
    const b = buckets[key] || (buckets[key] = {grid_in:0, grid_out:0});
    b.grid_in += p.kwh||0;
    b.grid_out += p.export_kwh||0;
  }
  const out = [];
  for(const r of series){
    const t = Date.parse(r.start);
    if(!isFinite(t)){ out.push(r); continue; }
    const key = granularity === "hour"
      ? Math.floor(t/(60*60*1000))*(60*60*1000)
      : Math.floor(t/half)*half;
    const b = buckets[key];
    out.push(b ? Object.assign({}, r, b) : r);
  }
  return out;
}

/* The chart is drawn to fit the box it is in, so it has to be drawn
   again when that box changes size. */
let usageRedraw = null;
window.addEventListener("resize", () => {
  clearTimeout(usageRedraw);
  usageRedraw = setTimeout(() => {
    renderUsage((window.SNAP && window.SNAP.usage) || {},
                (window.SNAP && window.SNAP.mini) || {});
  }, 120);
});

/* ---- today's figures, from the inverter's own daily report --------------- */
function renderDaily(s){
  const daily = (s && s.daily) || {};
  const totals = daily.totals || ((s && s.usage && s.usage.today) || {});
  const kwh = (k) => totals[k]!=null ? fmtP(totals[k])+" kWh" : "\u2014";
  const selfUsed = totals.house>0.05
    ? Math.max(0, Math.min(100, Math.round(100*(totals.house - (totals.grid_in||0))/totals.house)))
    : null;
  // "p" is the drop priority: p1 is always shown, p3 goes first when
  // the panel cannot fit every row.
  const rows = [
    ["Solar generated", kwh("pv"), "p1"],
    ["House used", kwh("house"), "p1"],
    ["Battery discharged", kwh("batt_out"), "p2"],
    ["Grid imported", kwh("grid_in"), "p1"],
    ["Exported", kwh("grid_out"), "p2"],
    ["Self-used", selfUsed!=null ? selfUsed+" %" : "\u2014", "p2"],
  ];
  if(!UI.dailyBuilt){ UI.dailyBuilt = true;
    $("daily").querySelector("tbody").innerHTML =
      rows.map(r=>`<tr class="${r[2]}"><td class="k">${r[0]}</td><td class="v"></td></tr>`).join("");
    UI.dailyVals = [...$("daily").querySelectorAll("td.v")];
  }
  rows.forEach((r,i)=> setText(UI.dailyVals[i], r[1]));
  $("dailyHint").innerHTML = daily.error
    ? daily.error
    : (daily.totals
        ? "From the inverter\u2019s own daily report"
        : "Waiting for the inverter\u2019s daily report");
}

/* ---- the Octopus panel ------------------------------------------------- */
function renderOctopus(o, mini){
  const rates = (o && o.rates) || {};
  const meter = (o && o.meter) || {};
  const live = (mini && mini.live) || {};
  const miniToday = (mini && mini.today) || {};
  const band = rates.band || "standard";
  const bandName = {cheap:"super cheap", peak:"peak", standard:"standard"}[band];
  const bandTag = band==="cheap" ? "cheap" : band==="peak" ? "peak" : "";
  $("octTariff").textContent = rates.tariff ? rates.tariff.toUpperCase() : "";

  const bandHtml = `<span class="bandtag ${bandTag}">${bandName}</span>`;
  const until = rates.band_until
    ? new Date(rates.band_until).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})
    : "";
  // The Mini reads the meter itself, so its figures are live and they win.
  const miniImport = miniToday.consumption_kwh;
  const miniExport = miniToday.export_kwh;
  const imported = miniImport!=null ? miniImport : meter.imported_kwh;
  const exported = miniExport!=null ? miniExport : meter.exported_kwh;
  const demand = live.demand_w;
  const tiles = [
    {k:"Import rate", c:"var(--muted)", v:fmtP(rates.import_p_kwh),
     u: rates.import_p_kwh!=null ? "p" : "",
     n: rates.import_p_kwh!=null ? (until ? bandName+" \u00b7 to "+until : bandName) : "not set",
     band: bandTag, tag:true},
    {k:"Export rate", c:"var(--flux)", v:fmtP(rates.export_p_kwh),
     u: rates.export_p_kwh!=null ? "p" : "",
     n: rates.export_p_kwh!=null ? (until ? bandName+" \u00b7 to "+until : bandName) : "not set",
     band: bandTag, tag:true},
    {k:"Imported", c:"var(--grid)", v:fmtP(imported),
     u: imported!=null ? "kWh" : "",
     n: miniImport!=null
        ? "\u00a3"+(miniToday.cost!=null ? miniToday.cost.toFixed(2) : "0.00")
          + (miniToday.partial ? " so far" : " live")
        : (meter.import_cost!=null
        ? "\u00a3"+meter.import_cost.toFixed(2)
          +(meter.import_source==="inverter" ? " estimated" : " paid")
        : (o && o.error ? "unavailable" : "no meter data"))},
    {k:"Exported", c:"var(--bat)", v:fmtP(exported),
     u: exported!=null ? "kWh" : "",
     n: miniExport!=null
        ? "live from the meter"
        : (meter.export_earning!=null
        ? "\u00a3"+meter.export_earning.toFixed(2)
          +(meter.export_source==="inverter" ? " estimated" : " earned")
        : (o && o.error ? "unavailable" : "no meter data"))},
  ];
  $("octTiles").innerHTML = tiles.map(t=>
    `<div class="tile"><div class="k"><span class="swatch" style="background:${t.c}"></span>${t.k}</div>
     <div class="v">${t.v}${t.u?`<small>${t.u}</small>`:""}</div>
     <div class="note ${t.band||""}">${t.n}</div></div>`).join("");

  const prem = rates.export_premium_p_kwh;
  const haveKey = (SNAP && SNAP.settings && SNAP.settings.octopus
                   && SNAP.settings.octopus.api_key);
  const stale = meter.last_reading_age_h!=null && meter.last_reading_age_h>6;
  const age = meter.last_reading_age_h!=null
    ? (meter.last_reading_age_h<48
        ? Math.round(meter.last_reading_age_h)+" hours ago"
        : Math.round(meter.last_reading_age_h/24)+" days ago")
    : "";
  const pill = $("octLive");
  if (demand!=null){
    pill.hidden = false;
    // a live draw is usually small, so watts read better than 0.02 kW
    const live = demand>=1000
      ? fmtP(demand/1000) + " kW"
      : Math.round(demand) + " W";
    pill.textContent = "\u25cf " + live + " now";
  } else {
    pill.hidden = true;
  }
  $("octHint").innerHTML = demand!=null
    ? "live from your Octopus Mini"
    : (mini && mini.error)
    ? "mini: " + mini.error
    : (o && o.error)
    ? o.error
    : (meter.imported_kwh==null && !haveKey)
      ? "The rates are public - add an API key for your meter readings"
    : (meter.imported_kwh==null)
      ? "No meter readings yet - check the API key and account number"
    : (meter.source==="inverter")
      ? `Estimated from the inverter - the meter's last reading was ${age}`
    : (stale)
      ? `The meter's last reading was ${age}`
    : (prem!=null && prem!==0)
      ? `Export now earns <b>${prem>0?"+":""}${prem.toFixed(2)}p</b> ${prem>0?"above":"below"} the standard rate`
      : (rates.band_until ? `band until ${new Date(rates.band_until).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}` : "");
}

/* ---- today's figures, derived from the local half-hour history --------- */
function renderToday(o){
  const t = (o && o.today) || {};
  const OCT = (window.SNAP && window.SNAP.octopus) || {};
  const MINI = (window.SNAP && window.SNAP.mini) || {};
  const miniToday = MINI.today || {};
  const g = (k, d) => (t[k]!=null ? fmtP(t[k]) : "\u2014");
  /* The share of the solar that stayed on site.  The old figure was
     (house - grid in) / house, which collapses to zero whenever the
     battery is charged from the grid - the opposite of the truth. */
  const solar = t.pv||0;
  const kept = solar>0.05 ? Math.max(0, Math.min(100,
      Math.round(100*(solar - (t.grid_out||0))/solar))) : null;
  const tiles = [
    {k:"Solar", c:"var(--pv)", v:g("pv"), u:"kWh", n:"generated"},
    {k:"House", c:"var(--load)", v:g("house"), u:"kWh", n:"used"},
    {k:"Battery", c:"var(--bat)", v:g("batt_out"), u:"kWh", n:"discharged"},
    {k:"Grid", c:"var(--grid)", v:g("grid_in"), u:"kWh", n:"imported"},
    {k:"Self-used", c:"var(--flux)", v:kept!=null?kept:"\u2014", u:"%",
     n:"of your solar"},
    {k:"Cost today", c:"var(--flux)",
     v:(miniToday.cost!=null) ? "\u00a3"+miniToday.cost.toFixed(2)
        : (OCT.cost!=null) ? "\u00a3"+OCT.cost.toFixed(2) : "\u2014",
     n:(miniToday.cost!=null) ? "live from the meter"
        : (OCT.cost!=null) ? (OCT.cost<0 ? "credit balance" : "so far") : "meter"},
  ];
  $("todayTiles").innerHTML = tiles.map(t=>
    `<div class="tile"><div class="k"><span class="swatch" style="background:${t.c}"></span>${t.k}</div>
     <div class="v">${t.v}${t.u?`<small>${t.u}</small>`:""}</div><div class="note">${t.n}</div></div>`).join("");
}

function connect(){
  const es = new EventSource("/events");
  es.onmessage = e => { sseOk=true; try{ render(JSON.parse(e.data)); }catch(_){} };
  es.onerror = () => {
    sseOk = false;
    $("liveStatus").textContent = "reconnecting…";
  };
}
// The event stream is the primary transport. Polling is only a fallback, so
// it stops as soon as the stream is healthy - two fetches a second on a
// Pi 3 is not free.
function poll(){
  fetch("/api/state").then(r=>r.json()).then(render).catch(()=>{});
}
connect();
let pollMs = (CFG.display && CFG.display.poll_ms) || 1000;
setInterval(()=>{ if(!sseOk) poll(); }, 2000);
matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyDisplay);
fetch("/api/state").then(r=>r.json()).then(render).catch(()=>{});
</script>
